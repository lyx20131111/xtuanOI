            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);

        .enter-btn:hover {
            background-color: #f4f6f8; /* 悬停效果 */
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        /* 图标 SVG */
        .enter-btn svg {
            width: 24px;
            height: 24px;
